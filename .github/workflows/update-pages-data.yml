name: Update GitHub Pages data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

jobs:
  update-pages-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build static site
        run: python3 car_compare.py --build-static docs

      - name: Commit updated static data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update GitHub Pages workbook data
          file_pattern: docs/index.html docs/workbook.json